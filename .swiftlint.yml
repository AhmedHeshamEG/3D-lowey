# hmm. studio limits (STUDIO §3): files 500 lines, type bodies 350, functions 60, cyclomatic complexity 12. CI runs
# `swiftlint --strict`, so reaching a warning threshold (the STUDIO limit) fails the build.
included:
  - App
  - AppUITests
  - Packages/LoweyCore/Sources
  - Packages/LoweyCore/Tests
  - Packages/LoweyEngine/Sources
  - Packages/LoweyEngine/Tests
  - Packages/LoweyFeatures/Sources
  - Packages/LoweyFeatures/Tests
excluded:
  - "**/.build"
  - Packages/HmmKit # linted in its own repository
  - DerivedData

identifier_name:
  min_length: 1
  max_length: 60
  excluded: [id, x, y, z, w, r, g, b, a, t, u, v, p, q, n]
type_name:
  min_length: 2
  max_length: 50
line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true
  # Scene Script and JavaScript examples inside multi-line strings are data, not code.
  ignores_multiline_strings: true
file_length:
  warning: 500
  error: 600
type_body_length:
  warning: 350
  error: 450
function_body_length:
  warning: 60
  error: 80
cyclomatic_complexity:
  warning: 12
  error: 15
  ignores_case_statements: true
large_tuple:
  warning: 4
  error: 5
function_parameter_count:
  warning: 8
  error: 10
nesting:
  type_level: 3
  function_level: 4

disabled_rules:
  - todo
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure
  - optional_data_string_conversion # String(decoding:as:) is the deliberate, lossless-enough choice for logs and tests

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - sorted_first_last
  - force_unwrapping
