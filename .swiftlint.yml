included:
  - App
  - AppTests
  - AppUITests
  - Packages/LoweyCore/Sources
  - Packages/LoweyCore/Tests
  - Packages/LoweyRender/Sources
  - Packages/LoweyScript/Sources
excluded:
  - "**/.build"
  - DerivedData
  - build

# Geometry and math code legitimately uses short names (x, y, z, a, b, t…).
identifier_name:
  min_length: 1
  max_length: 60
  excluded: [id, x, y, z, w, r, g, b, a, t, u, v, p, q, n]
type_name:
  min_length: 2
  max_length: 50
line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 900
  error: 1400
type_body_length:
  warning: 600
  error: 1000
function_body_length:
  warning: 120
  error: 220
cyclomatic_complexity:
  warning: 25
  error: 45
large_tuple:
  warning: 4
  error: 6
function_parameter_count:
  warning: 8
  error: 10
nesting:
  type_level: 3
  function_level: 4

disabled_rules:
  - todo
  - trailing_comma
  - opening_brace # SwiftFormat owns brace placement for multi-line conditions
  - force_try # used only in tests
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - sorted_first_last
