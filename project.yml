# XcodeGen spec. The .xcodeproj is generated from this file (`xcodegen generate`) and never committed: CI builds
# everything (Hesham has no Mac).
name: Lowey
options:
  bundleIdPrefix: studio.hmm
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/Branding.xcconfig
  Release: Config/Branding.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1,2" # iPad app; on iPhone it is the face companion
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  LoweyFeatures:
    path: Packages/LoweyFeatures

targets:
  Lowey:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Shared
      - path: App/Resources
    dependencies:
      - package: LoweyFeatures
      - target: LoweyWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Projects and the library are visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        # Exports keep running when the app leaves the screen (iPadOS 26 continued processing).
        BGTaskSchedulerPermittedIdentifiers:
          - studio.hmm.lowey.export.*
        # Build switches (FeatureFlags): the App Store build turns the bridge off until 2.1.
        LoweyAIBridge: true
        LoweyBackgroundBridge: true
        NSPhotoLibraryAddUsageDescription: "3D-lowey saves the videos and stills you export to your photo library."
        NSCameraUsageDescription: "3D-lowey uses the camera to follow the iPad when it acts as a film camera, and the front camera to read your face for character performances."
        NSMicrophoneUsageDescription: "3D-lowey records your voiceover so your animation can be timed to your words."
        NSLocalNetworkUsageDescription: "3D-lowey talks to your paired laptop (AI bridge, files) and your iPhone (face capture) on your local network only."
        NSBonjourServices:
          - _hmm._tcp
          - _loweyface._tcp
        # The laptop bridge keeps answering with the screen locked (sideloaded builds; BackgroundKeeper).
        UIBackgroundModes: [audio]
        NSSpeechRecognitionUsageDescription: "3D-lowey finds when each word is spoken, on this iPad, so shots can be synced to your voiceover."
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.khronos.gltf
            UTTypeDescription: glTF model
            UTTypeConformsTo: [public.data, public.3d-content]
            UTTypeTagSpecification:
              public.filename-extension: [gltf]
              public.mime-type: [model/gltf+json]
          - UTTypeIdentifier: org.khronos.glb
            UTTypeDescription: glTF binary model
            UTTypeConformsTo: [public.data, public.3d-content]
            UTTypeTagSpecification:
              public.filename-extension: [glb]
              public.mime-type: [model/gltf-binary]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: studio.hmm.lowey.project
            UTTypeDescription: 3D-lowey project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [lowey]
          - UTTypeIdentifier: studio.hmm.lowey.pack
            UTTypeDescription: 3D-lowey project file
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [loweypack]
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3D model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.pixar.universal-scene-description-mobile
              - org.khronos.gltf
              - org.khronos.glb
              - public.geometry-definition-format
          - CFBundleTypeName: 3D-lowey project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - studio.hmm.lowey.project
          - CFBundleTypeName: 3D-lowey project file
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - studio.hmm.lowey.pack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.hmm.lowey
        PRODUCT_NAME: Lowey
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MTL_ENABLE_DEBUG_INFO: NO

  # The export Live Activity (Lock Screen and Dynamic Island).
  LoweyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
      - path: App/Shared
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.hmm.lowey.widgets
        PRODUCT_NAME: LoweyWidgets
        SKIP_INSTALL: YES

  LoweyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Lowey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.hmm.lowey.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lowey

schemes:
  Lowey:
    build:
      targets:
        Lowey: all
        LoweyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: LoweyUITests
    archive:
      config: Release
