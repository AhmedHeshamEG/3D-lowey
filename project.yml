# XcodeGen spec. The .xcodeproj is generated from this file (`xcodegen generate`) and never committed: CI builds
# everything (Hesham has no Mac).
name: Lowey
options:
  bundleIdPrefix: studio.h
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/Branding.xcconfig
  Release: Config/Branding.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1,2" # iPad app; on iPhone it is the face companion
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  LoweyFeatures:
    path: Packages/LoweyFeatures

targets:
  Lowey:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Shared
      - path: App/Resources
        excludes: ["Kit/**"]
      # The Kit ships as one folder (its assets keep their Set folders; tools/fetch-kit.py builds it).
      - path: App/Resources/Kit
        type: folder
        buildPhase: resources
    dependencies:
      - package: LoweyFeatures
      - target: LoweyWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Export compliance: no encryption of our own (the bridge is plain HTTP on the local network; iCloud is the system's).
        ITSAppUsesNonExemptEncryption: false
        # English, Italian and Arabic (right to left) at 2.0: App/Resources/Localizable.xcstrings, InfoPlist.xcstrings.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it, ar]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Projects and the library are visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        # Exports keep running when the app leaves the screen (iPadOS 26 continued processing).
        BGTaskSchedulerPermittedIdentifiers:
          - studio.h.maquette.export.*
        # Build switches (FeatureFlags): the App Store build turns the bridge off until 2.1.
        LoweyAIBridge: true
        LoweyBackgroundBridge: true
        NSPhotoLibraryAddUsageDescription: "Maquette saves the videos and stills you export to your photo library."
        NSCameraUsageDescription: "Maquette uses the camera to follow the iPad when it acts as a film camera, and the front camera to read your face for character performances."
        NSMicrophoneUsageDescription: "Maquette records your voiceover so your animation can be timed to your words."
        NSLocalNetworkUsageDescription: "Maquette talks to your paired laptop (AI bridge, files) and your iPhone (face capture) on your local network only."
        NSBonjourServices:
          - _hmm._tcp
          - _loweyface._tcp
        # The laptop bridge keeps answering with the screen locked (sideloaded builds; BackgroundKeeper).
        UIBackgroundModes: [audio]
        NSSpeechRecognitionUsageDescription: "Maquette finds when each word is spoken, on this iPad, so shots can be synced to your voiceover."
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.khronos.gltf
            UTTypeDescription: glTF model
            UTTypeConformsTo: [public.data, public.3d-content]
            UTTypeTagSpecification:
              public.filename-extension: [gltf]
              public.mime-type: [model/gltf+json]
          - UTTypeIdentifier: org.khronos.glb
            UTTypeDescription: glTF binary model
            UTTypeConformsTo: [public.data, public.3d-content]
            UTTypeTagSpecification:
              public.filename-extension: [glb]
              public.mime-type: [model/gltf-binary]
          # 3D-lowey's projects and pack files still open (they import into Maquette).
          - UTTypeIdentifier: studio.hmm.lowey.project
            UTTypeDescription: 3D-lowey project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [lowey]
          - UTTypeIdentifier: studio.hmm.lowey.pack
            UTTypeDescription: 3D-lowey project file
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [loweypack]
          # Brushes from Procreate and Photoshop (their makers don't publish identifiers; these are by extension).
          - UTTypeIdentifier: studio.h.maquette.import.procreate-brushset
            UTTypeDescription: Procreate brush set
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [brushset]
          - UTTypeIdentifier: studio.h.maquette.import.procreate-brush
            UTTypeDescription: Procreate brush
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [brush]
          - UTTypeIdentifier: studio.h.maquette.import.photoshop-brushes
            UTTypeDescription: Photoshop brushes
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [abr]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: studio.h.maquette.project
            UTTypeDescription: Maquette project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [maquette]
          - UTTypeIdentifier: studio.h.maquette.pack
            UTTypeDescription: Maquette project file
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [maquettepack]
          - UTTypeIdentifier: studio.h.maquette.brushes
            UTTypeDescription: Maquette brush set
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [maquettebrushes]
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3D model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.pixar.universal-scene-description-mobile
              - org.khronos.gltf
              - org.khronos.glb
              - public.geometry-definition-format
          - CFBundleTypeName: Maquette project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - studio.h.maquette.project
              - studio.hmm.lowey.project
          - CFBundleTypeName: Maquette project file
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - studio.h.maquette.pack
              - studio.hmm.lowey.pack
          - CFBundleTypeName: Maquette brush set
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - studio.h.maquette.brushes
          - CFBundleTypeName: Brushes
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - studio.h.maquette.import.procreate-brushset
              - studio.h.maquette.import.procreate-brush
              - studio.h.maquette.import.photoshop-brushes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.h.maquette
        PRODUCT_NAME: Lowey
        # The studio's app group (shared with the widget; Cutaway joins it later).
        CODE_SIGN_ENTITLEMENTS: App/Maquette.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MTL_ENABLE_DEBUG_INFO: NO

  # The export Live Activity (Lock Screen and Dynamic Island).
  LoweyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
      - path: App/Shared
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.h.maquette.widgets
        CODE_SIGN_ENTITLEMENTS: App/Widgets/MaquetteWidgets.entitlements
        PRODUCT_NAME: LoweyWidgets
        SKIP_INSTALL: YES

  LoweyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Lowey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.h.maquette.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lowey

schemes:
  Lowey:
    build:
      targets:
        Lowey: all
        LoweyUITests: [test]
    run:
      config: Debug
      # 2.0 is paid upfront with no in-app purchases; the configuration is ready for testing any that come later.
      storeKitConfiguration: Config/Lowey.storekit
    test:
      config: Debug
      targets:
        - name: LoweyUITests
    archive:
      config: Release
