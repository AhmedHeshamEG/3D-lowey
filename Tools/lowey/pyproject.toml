[project]
name = "lowey-tools"
version = "2.0.0"
description = "Laptop side of 3D-lowey: the MCP server (lowey-mcp) and the companion CLI (lowey-link)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2"]

[project.scripts]
lowey-mcp = "lowey_tools.mcp_server:main"
lowey-link = "lowey_tools.link:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lowey_tools*"]

[tool.setuptools.package-data]
lowey_tools = ["generators/*.py"]
