# Every push / PR: lint → LoweyCore tests (Linux) + laptop tools + LoweyEngine render tests (iPad simulator)
# → app build for the iPad simulator, app tests and the UI smoke test (with screenshots).
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: Xcode 27.0 (iPadOS 27 SDK) on GitHub's xcode-27 runner image.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  lint:
    name: Lint (SwiftLint + SwiftFormat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat
        run: |
          curl -sSL -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat_linux.zip
          unzip -q swiftformat.zip -d swiftformat-bin
          chmod +x swiftformat-bin/swiftformat_linux
          swiftformat-bin/swiftformat_linux --lint . --reporter github-actions-log
      - name: SwiftLint
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 \
            swiftlint lint --strict --reporter github-actions-logging

  core-tests:
    name: LoweyCore tests + coverage (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Packages/LoweyCore/.build
          key: core-build-${{ hashFiles('Packages/LoweyCore/Package.swift', 'Packages/HmmKit/Package.swift') }}
      - name: Test (save → load round trips, v1 → v2 package upgrade, Look system, geometry)
        working-directory: Packages/LoweyCore
        # Serial: parallel runs corrupt the coverage profile.
        run: swift test --enable-code-coverage
      - name: Coverage gate (≥ 80% lines)
        working-directory: Packages/LoweyCore
        run: |
          PROFILE=$(dirname "$(swift test --show-codecov-path)")/default.profdata
          BINARY=$(find .build -name 'LoweyCorePackageTests.xctest' -type f | head -1)
          llvm-cov report "$BINARY" -instr-profile="$PROFILE" -ignore-filename-regex='Tests|\.build|HmmKit' | tee coverage.txt
          COVERAGE=$(grep TOTAL coverage.txt | awk '{print $10}' | tr -d '%')
          echo "Line coverage: $COVERAGE%"
          echo "### LoweyCore line coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$COVERAGE" 'BEGIN { exit !(c >= 80) }'

  tools:
    name: Laptop tools (lowey-mcp, lowey-link)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Blob measurements match the drawing (trace.json codegen)
        run: python Tools/gen-blob-measurements.py --check
      - name: Test against a fake iPad bridge
        working-directory: Tools/lowey
        run: |
          pip install -e ".[test]"
          pytest -q

  engine:
    name: LoweyEngine (Metal renderer) build + render tests
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Pick an iPad simulator
        id: sim
        run: echo "udid=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_OUTPUT"
      - name: Build and test (golden images, picking, skinning, preview = export, 4K spike, benchmark)
        working-directory: Packages/LoweyEngine
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/goldens"
          # A second attempt when the test runner itself hangs (R33); per-test retries can't recover that.
          for attempt in 1 2; do
            rm -rf "$RUNNER_TEMP/Engine.xcresult"
            TEST_RUNNER_GOLDEN_OUTPUT="$RUNNER_TEMP/goldens" xcodebuild test             -scheme LoweyEngine -destination "id=${{ steps.sim.outputs.udid }}"             -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/Engine.xcresult"             -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -retry-tests-on-failure -test-iterations 3             -skipPackagePluginValidation -IDEBuildingContinueBuildingAfterErrors=YES             SWIFT_TREAT_WARNINGS_AS_ERRORS=YES             | tee "$RUNNER_TEMP/engine.log" | grep -E "error:|warning:|Test Case .* failed|Executed|\*\* " || true
            grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/engine.log" && exit 0
            echo "::warning::Engine tests failed on attempt $attempt"
          done
          exit 1
      - name: Collect renders
        if: always()
        run: |
          mkdir -p renders
          cp "$RUNNER_TEMP"/goldens/*.png renders/ 2>/dev/null || true
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Engine.xcresult" --output-path renders || true
          ls renders | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-renders
          path: renders
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: engine-log
          path: ${{ runner.temp }}/engine.log
          retention-days: 7

  features:
    name: LoweyFeatures build + tests (iPad simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Feature boundaries (no feature reaches into another)
        run: python3 Tools/check-feature-boundaries.py
      - name: Pick an iPad simulator
        id: sim
        run: echo "udid=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: Packages/LoweyFeatures
        run: |
          set -o pipefail
          xcodebuild test -scheme LoweyFeatures -destination "id=${{ steps.sim.outputs.udid }}"             -derivedDataPath "$RUNNER_TEMP/DerivedData" -skipPackagePluginValidation -IDEBuildingContinueBuildingAfterErrors=YES             SWIFT_TREAT_WARNINGS_AS_ERRORS=YES             | tee "$RUNNER_TEMP/features.log" | grep -E "error:|warning:|Test Case .* failed|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/features.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: features-log
          path: ${{ runner.temp }}/features.log
          retention-days: 7

  app:
    name: iPad app build + UI smoke tests
    needs: [lint, core-tests, tools, engine, features]
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and the Metal toolchain
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPad simulator
        id: sim
        run: echo "udid=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_OUTPUT"
      - name: Build and run the UI smoke tests
        run: |
          set -o pipefail
          # Each test gets up to three tries and the run a second attempt: the simulator now and then fails to
          # terminate the app or stops answering a UI query (R33).
          for attempt in 1 2; do
            rm -rf TestResults.xcresult
            xcodebuild test -project Lowey.xcodeproj -scheme Lowey -destination "id=${{ steps.sim.outputs.udid }}"             -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult -skipPackagePluginValidation             -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -retry-tests-on-failure -test-iterations 3             CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|warning: |Test Case|Executed|\*\* " || true
            grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log && exit 0
            echo "::warning::UI smoke tests failed on attempt $attempt"
          done
          exit 1
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p attachments
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path attachments || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: attachments
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
