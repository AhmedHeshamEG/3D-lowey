# Every push / PR: lint → LoweyCore tests (Linux) + laptop tools + LoweyEngine render tests (iPad simulator)
# → app build for the iPad simulator, app tests and the UI smoke test (with screenshots).
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: Xcode 27.0 (iPadOS 27 SDK) on GitHub's xcode-27 runner image.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  lint:
    name: Lint (SwiftLint + SwiftFormat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat
        run: |
          curl -sSL -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat_linux.zip
          unzip -q swiftformat.zip -d swiftformat-bin
          chmod +x swiftformat-bin/swiftformat_linux
          swiftformat-bin/swiftformat_linux --lint . --reporter github-actions-log
      - name: SwiftLint
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 \
            swiftlint lint --reporter github-actions-logging

  core-tests:
    name: LoweyCore tests + coverage (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Packages/LoweyCore/.build
          key: core-build-${{ hashFiles('Packages/LoweyCore/Package.swift', 'Packages/HmmKit/Package.swift') }}
      - name: Test (save → load round trips, v1 → v2 package upgrade, Look system, geometry)
        working-directory: Packages/LoweyCore
        # Serial: parallel runs corrupt the coverage profile.
        run: swift test --enable-code-coverage
      - name: Coverage gate (≥ 80% lines)
        working-directory: Packages/LoweyCore
        run: |
          PROFILE=$(dirname "$(swift test --show-codecov-path)")/default.profdata
          BINARY=$(find .build -name 'LoweyCorePackageTests.xctest' -type f | head -1)
          llvm-cov report "$BINARY" -instr-profile="$PROFILE" -ignore-filename-regex='Tests|\.build|HmmKit' | tee coverage.txt
          COVERAGE=$(grep TOTAL coverage.txt | awk '{print $10}' | tr -d '%')
          echo "Line coverage: $COVERAGE%"
          echo "### LoweyCore line coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$COVERAGE" 'BEGIN { exit !(c >= 80) }'

  tools:
    name: Laptop tools (lowey-mcp, lowey-link)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test against a fake iPad bridge
        working-directory: Tools/lowey
        run: |
          pip install -e ".[test]"
          pytest -q

  engine:
    name: LoweyEngine (Metal renderer) build + render tests
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime: continue
              version = tuple(int(x) for x in runtime.split("iOS-")[-1].split("-"))
              for d in devices:
                  if "iPad" not in d["name"]: continue
                  score = (version, "iPad Air 13" in d["name"], "iPad Air" in d["name"])
                  if best is None or score > best[0]: best = (score, d["udid"], d["name"])
          print(best[1]); print(best[2], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test (golden images, picking, skinning, preview = export, 4K spike, benchmark)
        working-directory: Packages/LoweyEngine
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/goldens"
          TEST_RUNNER_GOLDEN_OUTPUT="$RUNNER_TEMP/goldens" xcodebuild test             -scheme LoweyEngine -destination "id=${{ steps.sim.outputs.udid }}"             -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/Engine.xcresult"             -skipPackagePluginValidation -IDEBuildingContinueBuildingAfterErrors=YES             SWIFT_TREAT_WARNINGS_AS_ERRORS=YES             | tee "$RUNNER_TEMP/engine.log" | grep -E "error:|warning:|Test Case .* failed|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/engine.log"
      - name: Collect renders
        if: always()
        run: |
          mkdir -p renders
          cp "$RUNNER_TEMP"/goldens/*.png renders/ 2>/dev/null || true
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Engine.xcresult" --output-path renders || true
          ls renders | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-renders
          path: renders
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: engine-log
          path: ${{ runner.temp }}/engine.log
          retention-days: 7

  app:
    name: iPad app build + render & UI tests
    needs: [lint, core-tests, tools, engine]
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install the Metal toolchain (needed for the RealityKit surface shader)
        run: xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedData/SourcePackages
          key: spm-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime: continue
              version = tuple(int(x) for x in runtime.split("iOS-")[-1].split("-"))
              for d in devices:
                  if "iPad" not in d["name"]: continue
                  score = (version, "iPad Air 13" in d["name"], "iPad Air" in d["name"])
                  if best is None or score > best[0]: best = (score, d["udid"], d["name"])
          print(best[1]); print(best[2], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build only (commit message contains [build-only])
        if: contains(github.event.head_commit.message, '[build-only]')
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Lowey.xcodeproj -scheme Lowey -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|\*\* " || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" xcodebuild.log
      - name: Build and test (render tests + UI smoke test)
        if: "!contains(github.event.head_commit.message, '[build-only]')"
        run: |
          set -o pipefail
          xcodebuild test \
            -project Lowey.xcodeproj -scheme Lowey \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|warning: .*Lowey|Test Case|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Export screenshots & renders
        if: always() && !contains(github.event.head_commit.message, '[build-only]')
        run: |
          mkdir -p attachments
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path attachments || true
          ls attachments | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-attachments
          path: attachments
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            TestResults.xcresult
          retention-days: 7
