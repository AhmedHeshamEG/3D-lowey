# Lint → pure modules on Linux (tests + ≥ 80 % line coverage) → Apple: iOS simulator tests and a macOS build.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  lint:
    name: Lint (SwiftFormat + SwiftLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat
        run: |
          curl -sSL -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat_linux.zip
          unzip -q swiftformat.zip -d swiftformat-bin
          chmod +x swiftformat-bin/swiftformat_linux
          swiftformat-bin/swiftformat_linux --lint . --reporter github-actions-log
      - name: SwiftLint (warnings are errors)
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 \
            swiftlint lint --strict --reporter github-actions-logging

  linux:
    name: Pure modules on Linux + coverage
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --enable-code-coverage
      - name: Coverage gate (≥ 80 % lines)
        run: |
          PROFILE=$(dirname "$(swift test --show-codecov-path)")/default.profdata
          BINARY=$(find .build -name 'HmmKitPackageTests.xctest' -type f | head -1)
          llvm-cov report "$BINARY" -instr-profile="$PROFILE" -ignore-filename-regex='Tests|\.build' | tee coverage.txt
          COVERAGE=$(grep TOTAL coverage.txt | awk '{print $10}' | tr -d '%')
          echo "### hmm-kit line coverage (Linux): ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$COVERAGE" 'BEGIN { exit !(c >= 80) }'

  apple:
    name: iOS simulator tests + macOS build
    needs: [lint, linux]
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime: continue
              version = tuple(int(x) for x in runtime.split("iOS-")[-1].split("-"))
              for d in devices:
                  if "iPad" not in d["name"]: continue
                  score = (version, "iPad Air" in d["name"])
                  if best is None or score > best[0]: best = (score, d["udid"], d["name"])
          print(best[1]); print(best[2], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test on the iOS simulator (every module, SwiftUI and AVFoundation included)
        run: |
          set -o pipefail
          xcodebuild test -scheme HmmKit-Package -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData -skipPackagePluginValidation \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | tee xcodebuild.log | grep -E "error:|warning:|Test Case .* failed|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: macOS build (the Mac apps compile from day one)
        run: swift build -Xswiftc -warnings-as-errors
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
